# =============================================================================
# docker-compose.yml — Sistema de Gestión Bibliotecaria Clásica
# Versión: 2.0 (Pivote arquitectónico)
# Simulación: t3.small — 256MB por servicio
# =============================================================================

version: "3.9"

networks:
  biblioteca_net:
    driver: bridge

volumes:
  redis_data:
  glpi_db_data:
  glpi_app_data:

services:

  # ============================================================================
  # NGINX — API Gateway
  # ============================================================================
  nginx-gateway:
    image: nginx:1.25-alpine
    container_name: biblioteca_gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - identity-service
      - inventory-service
      - loan-service
      - penalty-service
      - notification-service
    networks:
      - biblioteca_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m

  # ============================================================================
  # REDIS — Broker de mensajería y colas
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: biblioteca_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - biblioteca_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # ============================================================================
  # IDENTITY SERVICE — Usuarios, Roles (admin | bibliotecario | lector), Auth
  # DB Schema: identity
  # ============================================================================
  identity-service:
    build:
      context: ./identity-service
      dockerfile: ../docker/laravel.Dockerfile
    container_name: biblioteca_identity
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./identity-service:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      DB_SCHEMA: identity
    env_file:
      - .env
    networks:
      - biblioteca_net
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # ============================================================================
  # INVENTORY SERVICE — Libros, Autores, Categorías, Ejemplares Físicos
  # Antes: catalog-service | DB Schema: inventory
  # ============================================================================
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: ../docker/laravel.Dockerfile
    container_name: biblioteca_inventory
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./inventory-service:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      DB_SCHEMA: inventory
    env_file:
      - .env
    networks:
      - biblioteca_net
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # ============================================================================
  # LOAN SERVICE — Préstamos, Devoluciones, Renovaciones
  # Antes: order-service | DB Schema: loans
  # ============================================================================
  loan-service:
    build:
      context: ./loan-service
      dockerfile: ../docker/laravel.Dockerfile
    container_name: biblioteca_loans
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./loan-service:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      DB_SCHEMA: loans
    env_file:
      - .env
    networks:
      - biblioteca_net
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # ============================================================================
  # PENALTY SERVICE — Multas por retraso o pérdida de ejemplares
  # Antes: payment-service | DB Schema: penalties
  # ============================================================================
  penalty-service:
    build:
      context: ./penalty-service
      dockerfile: ../docker/laravel.Dockerfile
    container_name: biblioteca_penalties
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./penalty-service:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      DB_SCHEMA: penalties
    env_file:
      - .env
    networks:
      - biblioteca_net
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # ============================================================================
  # NOTIFICATION SERVICE — Redis PubSub + Envío de emails
  # DB Schema: ninguno (solo Redis + tabla de logs)
  # ============================================================================
  notification-service:
    build:
      context: ./notification-service
      dockerfile: ../docker/laravel.Dockerfile
    container_name: biblioteca_notifications
    working_dir: /var/www/html
    command: >
      sh -c "php artisan events:subscribe &
             php artisan queue:work redis --queue=notifications --sleep=3 --tries=3 --max-time=3600 &
             php artisan serve --host=0.0.0.0 --port=8000"
    volumes:
      - ./notification-service:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      DB_SCHEMA: ""
    env_file:
      - .env
    networks:
      - biblioteca_net
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  support-service:
    build:
      context: ./support-service
      dockerfile: ../docker/laravel.Dockerfile
    container_name: biblioteca_support
    working_dir: /var/www/html
    # 2 procesos: subscriber Redis + servidor HTTP para la REST API
    command: >
      sh -c "php artisan events:subscribe &
             php artisan serve --host=0.0.0.0 --port=8000"
    volumes:
      - ./support-service:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      DB_CONNECTION: null           # Sin base de datos
    env_file:
      - .env
    networks:
      - biblioteca_net
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m              # Ligero: sin DB, solo HTTP + Redis
  # ============================================================================
  # GLPI HELPDESK — Mesa de ayuda y Ticketing
  # Base de Datos independiente (MariaDB) para GLPI
  # ============================================================================
  glpi-db:
    image: mariadb:10.11
    container_name: biblioteca_glpi_db
    environment:
      - MARIADB_ROOT_PASSWORD=root_secret_glpi
      - MARIADB_DATABASE=glpi_db
      - MARIADB_USER=glpi_user
      - MARIADB_PASSWORD=glpi_password
    volumes:
      - glpi_db_data:/var/lib/mysql
    networks:
      - biblioteca_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  glpi:
    image: diouxx/glpi:latest
    container_name: biblioteca_glpi
    ports:
      - "8081:80" # Tu API Gateway usa el 8080, dejaremos GLPI en el 8081
    environment:
      - TIMEZONE=America/Lima
    volumes:
      - glpi_app_data:/var/www/html/glpi
    networks:
      - biblioteca_net
    depends_on:
      - glpi-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
  
  # Agregar este bloque al docker-compose.yml existente:
