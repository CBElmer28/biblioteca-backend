# =============================================================================
# gateway.conf — API Gateway: Sistema de Gestión Bibliotecaria Clásica
# Versión: 2.0 (Pivote de E-commerce → Biblioteca)
# =============================================================================

upstream identity    { server identity-service:8000; }
upstream inventory   { server inventory-service:8000; }   # era: catalog-service
upstream loans       { server loan-service:8000; }         # era: order-service
upstream penalties   { server penalty-service:8000; }      # era: payment-service
upstream notifications { server notification-service:8000; }

server {
    listen 80;

    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Rutas de cada microservicio ───────────────────────────────────────────
    location /api/v1/identity/      { proxy_pass http://identity/; }
    location /api/v1/inventory/     { proxy_pass http://inventory/; }
    location /api/v1/loans/         { proxy_pass http://loans/; }
    location /api/v1/penalties/     { proxy_pass http://penalties/; }
    location /api/v1/notifications/ { proxy_pass http://notifications/; }

    location /health {
        return 200 '{"gateway":"ok","system":"biblioteca-clasica"}';
        add_header Content-Type application/json;
    }

    location / {
        return 404 '{"error":"ruta no encontrada en el gateway"}';
        add_header Content-Type application/json;
    }
}